<dialog id="incident">
  <div class="dialog-head">
    <h2 id="incident-title">災害の経過</h2>
    <button data-close="incident" class="close" aria-label="閉じる">×</button>
  </div>
  <div id="incident-content"></div>
</dialog>

<dialog id="detail">
  <div class="dialog-head">
    <div>
      <span class="eyebrow">REPORT DETAILS</span>
      <h2>投稿の詳細</h2>
    </div>
    <button id="refresh-detail" class="quiet">↻ 評価を更新</button>
    <button data-close="detail" class="close" aria-label="閉じる">×</button>
  </div>
  <div id="detail-content"></div>
</dialog>

<dialog id="manage">
  <div class="dialog-head">
    <h2>投稿を管理する</h2>
    <button data-close="manage" class="close" aria-label="閉じる">×</button>
  </div>

  <p>このリンクを持つ人は編集・削除できます。大切に保管してください。</p>

  <form id="manage-form">
    <label>
      説明文
      <textarea id="edit-description" maxlength="2000" required rows="5"></textarea>
    </label>
    <div class="field-row">
      <button class="primary">変更を保存</button>
      <button class="danger" type="button" id="delete-post">投稿を削除</button>
    </div>
  </form>

  <section class="verification-block">
    <h2>SynthIDの手動確認</h2>
    <p>投稿前の元画像をGoogle公式ツールにアップロードして確認し、その結果を記録してください。</p>
    <p>
      <a href="https://synthid.com/" target="_blank" rel="noopener noreferrer">
        SynthID Detectorを開く ↗
      </a>
      ·
      <a href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">
        Geminiを開く ↗
      </a>
    </p>
    <p>
      <a id="synthid-photo" target="_blank" rel="noopener noreferrer">
        この投稿の公開画像を開く ↗
      </a>
    </p>
    <small>公開画像は縮小・変換済みです。元画像を持っている場合は、元画像で確認してください。</small>

    <form id="synthid-review-form">
      <label>
        使用した公式ツール
        <select id="synthid-tool" required>
          <option value="detector">SynthID Detector</option>
          <option value="gemini">GeminiのSynthID確認機能</option>
        </select>
      </label>

      <label>
        確認した画像
        <select id="synthid-source" required>
          <option value="original">投稿前の元画像</option>
          <option value="published">公開用の変換済み画像</option>
        </select>
      </label>

      <label>
        結果
        <select id="synthid-result" required>
          <option value="">選択してください</option>
          <option value="detected">電子透かしを検出</option>
          <option value="not_detected">電子透かし未検出</option>
          <option value="inconclusive">判断できず</option>
        </select>
      </label>

      <label>
        公式ツールに表示された内容
        <textarea
          id="synthid-note"
          required
          maxlength="1000"
          rows="3"
          placeholder="生成元が表示された場合はその名前も記入してください"
        ></textarea>
      </label>

      <label class="consent">
        <input id="synthid-confirmed" type="checkbox" required>
        公式ツールで、この投稿の画像を実際に確認しました
      </label>

      <button class="primary" id="save-synthid">確認結果を保存</button>
    </form>
  </section>
</dialog>
